# 依赖已知漏洞（RustSec）：保留 Cargo.lock 变更检查和手动运行。
# zip 8.6.0 的三个 RustSec 告警尚未修复，暂停每周重复运行；不忽略漏洞。
name: audit

on:
  workflow_dispatch:
  push:
    paths: ['Cargo.lock']
  pull_request:
    paths: ['Cargo.lock']

# audit-check 要往提交上写 check run（checks: write）、发现漏洞时开 issue（issues: write）；少了 checks 会在 push 事件上报 "Resource not accessible by integration"
permissions:
  contents: read
  checks: write
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
