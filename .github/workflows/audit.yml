# 依赖已知漏洞（RustSec）：每周检查，依赖或兼容补丁变化时也检查。
name: audit

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 1'
  push:
    paths: ['Cargo.lock', 'Cargo.toml', 'vendor/candle-core/**', '.github/workflows/audit.yml']
  pull_request:
    paths: ['Cargo.lock', 'Cargo.toml', 'vendor/candle-core/**', '.github/workflows/audit.yml']

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: 1.96.0

      - name: Install pinned cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked

      # 直接使用审计退出码；禁用 Issues 的 fork 也能报告真实漏洞。
      - name: Audit dependencies
        run: cargo audit
